                setCurrentIndex(0);
                setIsFlipped(false);
                setShowHint(false);
            }, [selectedCategory]);

                setIsFlipped(false);
                setShowHint(false);
                setTimeout(() => {
                    setCurrentIndex((prev) => (prev + 1) % filteredCards.length);
                }, 150);
            };

            const handlePrev = () => {
                setIsFlipped(false);
                setShowHint(false);
                setTimeout(() => {
                    setCurrentIndex((prev) => (prev - 1 + filteredCards.length) % filteredCards.length);
                }, 150);
            };

            const handleShuffle = () => {
                setIsFlipped(false);
                setShowHint(false);
                const shuffled = [...cards].sort(() => Math.random() - 0.5);
                setCards(shuffled);
                setCurrentIndex(0);
            };

                                ) : (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-xs text-slate-400 hover:text-amber-400 underline transition"
                                    >
                                        Butuh petunjuk?
                                    </button>
                                )}
                            </div>

                            {/* Navigation Buttons */}
                            <div className="flex items-center gap-4 mt-6 w-full max-w-xs">
                                <button 
                                    onClick={handlePrev}
                                    className="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold rounded-xl transition shadow flex items-center justify-center gap-2"
                                >
                                    ← Sebelum
                                </button>
                                <button 
                                    onClick={handleNext}
                                    className="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition shadow flex items-center justify-center gap-2"
                                >
                                    Lanjut →
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-12 text-slate-400">
                            Tidak ada kartu pada topik ini.
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-auto text-center py-4 text-xs text-slate-500">
                        Sukses UTS Algoritma & Pemrograman! Diproduksi untuk persiapan belajar cepat.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

        // Render Lucide Icons
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 500);
    </script>
</body>
</html>
